<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
    <title>My Task</title>
  </head>
  <body>
    <main id="app">
      <h1>Minhas tarefas</h1>

      <form id="add-task-form">
        <input
          type="text"
          name="add-task-input"
          id="add-task-input"
          placeholder="Digite a sua tarefa..."
          aria-label="Digite a sua tarefa..."
        />
        <button type="submit" id="add-task-btn">Adicionar tarefas</button>
      </form>

      <div id="filter-container">
        <button id="all" type="button">Todas</button>
        <button id="pending" type="button">Pendente</button>
        <button id="done" type="button">Concluída</button>
      </div>

      <ul id="task-list"></ul>

      <div id="done-container">
        <p id="message">0 de 0 tarefas concluídas</p>
        <button id="clean-btn" type="button">Limpar concluídas</button>
      </div>
    </main>
  </body>
</html>
